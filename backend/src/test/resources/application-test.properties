spring.datasource.url=jdbc:h2:mem:aloo_cms_test;MODE=MSSQLServer;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

jwt.secret=ALOO_Franchise_CMS_Test_Secret_Key_At_Least_32_Chars
jwt.expiration-ms=3600000

app.cors.allowed-origin=http://localhost:5173
app.admin.email=admin@aloo.vn
app.admin.password=123456
app.admin.full-name=ALOO Test Admin
app.user.email=user@aloo.vn
app.user.password=123456
app.user.full-name=ALOO Test User
app.upload.dir=target/test-uploads
app.rate-limit.backend=memory
