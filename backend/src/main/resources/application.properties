server.port=8080
spring.config.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.application.name=aloo-franchise-cms-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Flyway is the only component allowed to change production schema. Existing
# installations are baselined immediately before the first managed migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20260624
spring.flyway.validate-migration-naming=true
spring.flyway.user=${DB_MIGRATION_USERNAME:${spring.datasource.username}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${spring.datasource.password}}

spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.cors.include-localhost=${CORS_INCLUDE_LOCALHOST:false}
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-size-bytes=${UPLOAD_MAX_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:6MB}
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}

# Comma-separated Gmail/emails allowed to become CMS admins.
# Empty whitelist is rejected when require-email-whitelist=true (production default).
app.admin.email-whitelist=${ADMIN_EMAIL_WHITELIST:}
app.admin.require-email-whitelist=${ADMIN_EMAIL_WHITELIST_REQUIRED:true}

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@aloo.vn}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

app.password-change.otp.ttl-minutes=${PASSWORD_CHANGE_OTP_TTL_MINUTES:10}

app.rate-limit.backend=${RATE_LIMIT_BACKEND:memory}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}

logging.level.com.aloo.cms=INFO

app.chat.auto.enabled=${CHAT_AUTO_ENABLED:true}
app.chat.auto.sender-name=${CHAT_AUTO_SENDER_NAME:ALOO Tư vấn}
app.chat.auto.welcome-message=${CHAT_AUTO_WELCOME_MESSAGE:Xin chào! Cảm ơn bạn đã liên hệ ALOO. Team tư vấn sẽ phản hồi bạn trong thời gian sớm nhất. Bạn cần hỗ trợ về sản phẩm, cửa hàng hay nhượng quyền ạ?}
app.chat.auto.received-message=${CHAT_AUTO_RECEIVED_MESSAGE:Cảm ơn bạn đã nhắn tin. ALOO đã nhận được và sẽ trả lời bạn sớm nhất có thể.}
