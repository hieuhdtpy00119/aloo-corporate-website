server.port=8080

spring.application.name=aloo-franchise-cms-backend

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ALOO_Franchise_CMS;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

jwt.secret=${JWT_SECRET:ALOO_Franchise_CMS_Change_This_Secret_Key_At_Least_32_Chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:admin@aloo.vn}
app.admin.password=${ADMIN_PASSWORD:123456}
app.admin.full-name=${ADMIN_FULL_NAME:ALOO Admin}
app.user.email=${USER_EMAIL:user@aloo.vn}
app.user.password=${USER_PASSWORD:123456}
app.user.full-name=${USER_FULL_NAME:ALOO User}
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-size-bytes=${UPLOAD_MAX_SIZE_BYTES:5242880}

app.rate-limit.backend=${RATE_LIMIT_BACKEND:memory}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}

logging.level.com.aloo.cms=INFO
