server.port=8080

spring.application.name=aloo-franchise-cms-backend

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ALOO_Franchise_CMS;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=change-me
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

jwt.secret=change-this-secret-to-at-least-32-characters
jwt.expiration-ms=86400000

telegram.bot.token=
telegram.chat.id=

app.cors.allowed-origin=http://localhost:5173
app.admin.email=admin@aloo.vn
app.admin.password=change-me
app.admin.full-name=ALOO Admin
app.user.email=user@aloo.vn
app.user.password=change-me
app.user.full-name=ALOO User
app.upload.dir=uploads
app.upload.max-size-bytes=5242880

# Use "memory" for local dev or "redis" for multi-instance production deployments.
app.rate-limit.backend=memory
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms
